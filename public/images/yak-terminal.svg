<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Yak's terminal chat interface, showing its startup banner and a file-read tool call">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1a17"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>

  <rect x="140" y="110" width="1000" height="500" rx="14" fill="#12161b" stroke="#272d35" stroke-width="1.5"/>
  <rect x="140" y="110" width="1000" height="44" rx="14" fill="#171c22"/>
  <rect x="140" y="140" width="1000" height="14" fill="#171c22"/>
  <circle cx="168" cy="132" r="6" fill="#4a3a35"/>
  <circle cx="190" cy="132" r="6" fill="#4a4330"/>
  <circle cx="212" cy="132" r="6" fill="#304a3c"/>
  <text x="640" y="137" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#a4abb6">yak — zsh</text>

  <g font-family="JetBrains Mono, monospace" font-size="15" fill="#d8dee5">
    <text x="172" y="192" fill="#83ddd6">$ npm run chat</text>

    <text x="172" y="232">Yak (claude / claude-sonnet-4-20250514)</text>
    <text x="172" y="258">Project: ~/yak</text>
    <text x="172" y="284" fill="#a4abb6">Type a message. /exit to quit.</text>

    <text x="172" y="334" fill="#83ddd6">you&gt; </text>
    <text x="220" y="334">what does src/app.ts do?</text>

    <text x="172" y="372" fill="#6f7a86">  &#183; read_file src/app.ts</text>

    <text x="172" y="420" fill="#83ddd6">yak&gt; </text>
    <rect x="222" y="406" width="9" height="18" fill="#83ddd6">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="JetBrains Mono, monospace" font-size="12" fill="#6f7a86">
    <text x="172" y="560" fill="#44505a">list_files</text>
    <text x="280" y="560" fill="#44505a">read_file</text>
    <text x="388" y="560" fill="#44505a">write_file</text>
  </g>

  <g font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="2" fill="#4a5661">
    <text x="172" y="595">OPENAI</text>
    <text x="280" y="595">CLAUDE</text>
    <text x="388" y="595">GEMINI</text>
  </g>
</svg>
